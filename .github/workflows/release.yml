# Publishes a GitHub release when a version tag is pushed:
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# Runs the unit tests and the integration tests against a throwaway Immich
# (Docker) first; the release and the container image are only published if
# they pass. Tags with a hyphen (v0.2.0-rc.1) become pre-releases and don't
# move the image's `latest` tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files
  packages: read # pull the Immich images from ghcr.io as an authenticated user

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, for the release notes

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install ffmpeg and exiftool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libimage-exiftool-perl
          ffmpeg -hide_banner -version | head -1
          exiftool -ver

      - name: Unit tests
        run: go test ./...

      # Anonymous pulls from shared runner IPs hit registry rate limits
      # ("toomanyrequests"), so log in to ghcr.io and retry with backoff.
      - name: Log in to the GitHub container registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull Immich images
        run: |
          for attempt in 1 2 3 4 5; do
            docker compose -f test/integration/docker-compose.yml pull --quiet && exit 0
            wait=$((attempt * 30))
            echo "::warning::image pull failed (attempt $attempt of 5); retrying in ${wait}s"
            sleep "$wait"
          done
          echo "::error::could not pull the Immich images after 5 attempts"
          exit 1

      - name: Start throwaway Immich
        run: make immich-up

      - name: Integration tests
        run: make integration

      - name: Stop Immich
        if: always()
        run: make immich-down

      - name: Build release binaries
        run: make dist VERSION="$GITHUB_REF_NAME"

      - name: Check the binary reports this version
        run: |
          got=$(./dist/immich-transcode-linux-amd64 --version)
          echo "$got"
          test "$got" = "immich-transcode $GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Requires ffmpeg and ffprobe with libx265, and exiftool (see the README). Download the binary for your system; SHA256SUMS lists their checksums." \
            $prerelease

  # Multi-arch image at ghcr.io/<owner>/immich-transcode, after the tests pass.
  image:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # v1.2.3 → 1.2.3, 1.2, latest; v1.2.3-rc.1 → 1.2.3-rc.1 only.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image reports this version
        run: |
          image=ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}
          got=$(docker run --rm "$image" --version)
          echo "$got"
          test "$got" = "immich-transcode $GITHUB_REF_NAME"
